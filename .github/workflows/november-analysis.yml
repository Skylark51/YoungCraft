name: November analysis and crystallography regression
on:
  pull_request:
  workflow_dispatch:
    inputs:
      focused:
        description: Run only the UX click and DPI review
        type: boolean
        default: false

concurrency:
  group: november-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ssh-fixture:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Build and verify native OpenSSH fixture
        shell: pwsh
        run: |
          cmake -S . -B build-ssh -G Ninja -DCMAKE_BUILD_TYPE=Release -DYOUNGCRAFT_RUNTIME_OUTPUT_DIRECTORY=build-ssh/dist
          if ($LASTEXITCODE -ne 0) { throw 'SSH fixture configure failed' }
          cmake --build build-ssh --target test_orbitals --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'SSH fixture build failed' }
          ctest --test-dir build-ssh --output-on-failure --timeout 180 -R '^orbital_study$'
          $fixtureExit = $LASTEXITCODE
          if (Test-Path build-ssh/orbital-regression.txt) { Get-Content build-ssh/orbital-regression.txt }
          if ($fixtureExit -ne 0) { throw 'Native OpenSSH fixture failed' }
      - name: Upload native OpenSSH evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ssh-fixture-evidence
          path: |
            build-ssh/orbital-regression.txt
            build-ssh/Testing/Temporary/LastTest.log
  windows-regression:
    if: inputs.focused != true
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare actual MM worker validation
        run: python -m pip install rdkit==2026.3.6 pyinstaller==6.22.3
      - uses: actions/cache/restore@v4
        id: mm_worker_cache
        with:
          path: .build/mm-runtime-ci/YoungcraftMM
          key: win2022-mm-rdkit2026036-pyi6223-${{ hashFiles('tools/mm_optimize.py', 'tools/build_mm_runtime.ps1') }}
      - name: Build actual MM worker for GUI tests
        if: steps.mm_worker_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/build_mm_runtime.ps1 -OutputDir .build/mm-runtime-ci
      - uses: actions/cache/save@v4
        if: steps.mm_worker_cache.outputs.cache-hit != 'true'
        with:
          path: .build/mm-runtime-ci/YoungcraftMM
          key: win2022-mm-rdkit2026036-pyi6223-${{ hashFiles('tools/mm_optimize.py', 'tools/build_mm_runtime.ps1') }}
      - uses: actions/cache/restore@v4
        id: corpus_cache
        with:
          path: .build/november-corpus
          key: november-corpus-${{ hashFiles('tests/data/november-corpus-sources.json') }}
      - name: Fetch checksum-verified public corpus
        run: python tools/fetch_november_corpus.py .build/november-corpus
      - uses: actions/cache/save@v4
        if: steps.corpus_cache.outputs.cache-hit != 'true'
        with:
          path: .build/november-corpus
          key: november-corpus-${{ hashFiles('tests/data/november-corpus-sources.json') }}
      - name: Prepare verified xTB runtime
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'xtb-win.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'xtb-win'
          Invoke-WebRequest -Uri 'https://github.com/grimme-lab/xtb/releases/download/v6.7.1/xtb-6.7.1pre-windows-x86_64.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '043e578da4a7e114a4d584972959a875e3ffb9f2767a86723b95aa6719d28d9c') { throw 'xTB checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          foreach ($name in @('xtb.exe', 'libiomp5md.dll')) {
            $binary = Get-ChildItem -LiteralPath $extract -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $binary) { throw "Missing runtime binary: $name" }
            Copy-Item -LiteralPath $binary.FullName -Destination (Join-Path 'xtb_runtime' $name) -Force
          }
      - uses: actions/cache/restore@v4
        id: xtb_backend_cache
        with:
          path: xtb_runtime/gfnff
          key: win2022-ucrt64-xtb68fe777a-mctc061-v1
      - uses: msys2/setup-msys2@v2
        if: steps.xtb_backend_cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-openblas mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja unzip curl
      - name: Build explicit-topology xTB backend from pinned sources
        if: steps.xtb_backend_cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p .build/xtb-backend
          cd .build/xtb-backend
          curl -fL https://codeload.github.com/grimme-lab/xtb/zip/68fe777a02418471b9ddfc7a9ea24b4021d7bca2 -o xtb.zip
          curl -fL https://codeload.github.com/grimme-lab/mctc-lib/zip/refs/tags/v0.6.1 -o mctc.zip
          echo 'ed92501f770a02bea4d00782f61d0bdcb61981353ee9093578d49a0b0a942bcd  xtb.zip' | sha256sum -c -
          echo '549477402f38de3a2ffc3d16558b12e177920d7e0c3e3af5067c83cfc2968ba7  mctc.zip' | sha256sum -c -
          unzip -q xtb.zip
          unzip -q mctc.zip
          cmake -S xtb-68fe777a02418471b9ddfc7a9ea24b4021d7bca2 -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_TBLITE=OFF -DWITH_CPCMX=OFF -DWITH_TESTS=OFF -DFETCHCONTENT_SOURCE_DIR_MCTC-LIB="$PWD/mctc-lib-0.6.1" -DBLAS_LIBRARIES=/ucrt64/lib/libopenblas.dll.a -DLAPACK_LIBRARIES=/ucrt64/lib/libopenblas.dll.a
          cmake --build build --parallel 4
          target="$GITHUB_WORKSPACE/xtb_runtime/gfnff"
          cp build/xtb.exe "$target/xtb.exe"
          for dll in libgcc_s_seh-1.dll libgfortran-5.dll libgomp-1.dll libopenblas.dll libquadmath-0.dll libwinpthread-1.dll libstdc++-6.dll; do cp "/ucrt64/bin/$dll" "$target/"; done
      - uses: actions/cache/save@v4
        if: steps.xtb_backend_cache.outputs.cache-hit != 'true'
        with:
          path: xtb_runtime/gfnff
          key: win2022-ucrt64-xtb68fe777a-mctc061-v1
      - name: Configure and build Release
        id: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYOUNGCRAFT_RUNTIME_OUTPUT_DIRECTORY=build/dist
          cmake --build build --parallel 4
      - name: Stage calculation runtimes beside both GUI executables
        shell: pwsh
        run: |
          foreach ($directory in @('build', 'build/dist')) {
            $mm = Join-Path $directory 'mm_runtime'
            New-Item -ItemType Directory -Path $mm -Force | Out-Null
            Get-ChildItem -LiteralPath .build/mm-runtime-ci/YoungcraftMM -Force | Copy-Item -Destination $mm -Recurse -Force
            Copy-Item -LiteralPath xtb_runtime -Destination (Join-Path $directory 'xtb_runtime') -Recurse -Force
          }
      - name: Run console and calculation regressions
        shell: pwsh
        run: |
          $env:YOUNGCRAFT_NOVEMBER_CORPUS=(Resolve-Path '.build/november-corpus').Path
          ctest --test-dir build -C Release --output-on-failure --timeout 180 -E 'gui_smoke|orbital_study'
          if ($LASTEXITCODE -ne 0) { throw 'Console regression failed' }
      # Never launch these graphical checks on the user's desktop.
      - name: Prepare verified Windows OpenGL
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: ./tools/prepare_ci_opengl.ps1
      - name: Verify all GUI workflows and orbital integration
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        env:
          YOUNGCRAFT_UX_VARIANT: after
          YOUNGCRAFT_UX_EVIDENCE: .build/ux-evidence/after
          YOUNGCRAFT_NOVEMBER_CORPUS: .build/november-corpus
          YOUNGCRAFT_PPTX_TEST_OUTPUT: .build/ux-evidence/after/mechanism.pptx
          YOUNGCRAFT_PPTX_TEST_WIDTH: '640'
        run: |
          New-Item -ItemType Directory -Path .build/ux-evidence/after -Force | Out-Null
          $env:YOUNGCRAFT_CHARGED_MM_WORKER = (Resolve-Path build/mm_runtime/YoungcraftMM.exe).Path
          ctest --test-dir build -C Release --output-on-failure --timeout 180 -R '^orbital_study$'
            $orbitalExit = $LASTEXITCODE
            if (Test-Path build/orbital-regression.txt) { Get-Content build/orbital-regression.txt }
          python tools/run_gui_regressions.py --exe ./build/test_smoke.exe --timeout 120 --all
            $guiExit = $LASTEXITCODE
            if ($orbitalExit -ne 0 -or $guiExit -ne 0) {
              throw "Regression failed (orbital=$orbitalExit, GUI=$guiExit); see per-case evidence"
            }
      - name: Review layouts at 150 and 200 percent DPI
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          foreach ($scale in @('1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            $env:YOUNGCRAFT_UX_VARIANT = 'after'
            $env:YOUNGCRAFT_UX_EVIDENCE = ".build/ux-evidence/after-dpi-$scale"
            & ./build/test_smoke.exe uxResponsiveLayouts -o ".build/ux-evidence/dpi-$scale.txt,txt"
            if ($LASTEXITCODE -ne 0) { throw "Layout review failed at scale $scale" }
          }
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: november-regression-evidence
          include-hidden-files: true
          path: |
            gui-november-*.txt
            gui-november-summary.json
            build/Testing/Temporary/LastTest.log
              build/orbital-regression.txt
            .build/november-corpus/provenance.json
            .build/ux-evidence/
  baseline-ux-evidence:
    if: inputs.focused != true
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Build the unchanged baseline with the same review harness
        shell: pwsh
        run: |
          git worktree add --detach baseline 0753d1a
          if ($LASTEXITCODE -ne 0) { throw 'Baseline checkout failed' }
          Copy-Item tests/smoke/test_smoke.cpp baseline/tests/smoke/test_smoke.cpp -Force
          Copy-Item tests/smoke/ux_*.inc baseline/tests/smoke/ -Force
          cmake -S baseline -B baseline-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYOUNGCRAFT_RUNTIME_OUTPUT_DIRECTORY=baseline-build/dist
          if ($LASTEXITCODE -ne 0) { throw 'Baseline configure failed' }
          cmake --build baseline-build --target test_smoke --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed' }
      - name: Prepare verified Windows OpenGL
        shell: pwsh
        run: ./tools/prepare_ci_opengl.ps1
      - name: Measure baseline clicks and capture screens
        shell: pwsh
        env:
          YOUNGCRAFT_UX_VARIANT: before
          YOUNGCRAFT_UX_EVIDENCE: .build/ux-evidence/before
        run: |
          New-Item -ItemType Directory -Path .build/ux-evidence/before -Force | Out-Null
          & ./baseline-build/test_smoke.exe uxClickMeasurements uxResponsiveLayouts uxCompleteImageSave uxAnalysisClickMeasurements -o '.build/ux-evidence/before/review.txt,txt'
          if ($LASTEXITCODE -ne 0) { throw 'Baseline review failed' }
      - name: Upload baseline review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-baseline-evidence
          include-hidden-files: true
          path: .build/ux-evidence/
  focused-ux-review:
    if: inputs.focused == true
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Build UX review executable
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYOUNGCRAFT_RUNTIME_OUTPUT_DIRECTORY=build/dist
          if ($LASTEXITCODE -ne 0) { throw 'Review configure failed' }
          cmake --build build --target test_smoke --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Review build failed' }
      - name: Prepare verified Windows OpenGL
        shell: pwsh
        run: ./tools/prepare_ci_opengl.ps1
      - name: Record clicks and all DPI layouts
        shell: pwsh
        run: |
          $env:YOUNGCRAFT_UX_VARIANT = 'after'
          $env:YOUNGCRAFT_UX_EVIDENCE = '.build/ux-evidence/after'
          New-Item -ItemType Directory -Path .build/ux-evidence/after -Force | Out-Null
          $reviewFailed = $false
          & ./build/test_smoke.exe uxClickMeasurements uxCompleteImageSave uxAnalysisClickMeasurements -o '.build/ux-evidence/after/click-review.txt,txt'
          if ($LASTEXITCODE -ne 0) { $reviewFailed = $true }
          foreach ($scale in @('1', '1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            & ./build/test_smoke.exe uxResponsiveLayouts -o ".build/ux-evidence/after/layout-$scale.txt,txt"
            if ($LASTEXITCODE -ne 0) { $reviewFailed = $true }
          }
          if ($reviewFailed) { throw 'Review failed; inspect every DPI log and image' }
      - name: Upload UX review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-focused-evidence
          include-hidden-files: true
          path: .build/ux-evidence/
