name: Build YoungCraft portable release
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'tools/package_portable.ps1'
      - 'tools/build_mm_runtime.ps1'
      - '.github/workflows/portable-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-release
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-mm.txt
      - name: Install MM dependencies
        shell: pwsh
        run: python -m pip install -r tools/requirements-mm.txt
      - name: Download verified Windows xTB runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'xtb-win.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'xtb-win'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/grimme-lab/xtb/releases/download/v6.7.1/xtb-6.7.1pre-windows-x86_64.zip' -OutFile $zip
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '043e578da4a7e114a4d584972959a875e3ffb9f2767a86723b95aa6719d28d9c') {
            throw "xTB release checksum mismatch: $sha"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          foreach ($name in @('xtb.exe', 'libiomp5md.dll')) {
            $binary = Get-ChildItem -LiteralPath $extract -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $binary) { throw "Required xTB binary missing: $name" }
            Copy-Item -LiteralPath $binary.FullName -Destination (Join-Path 'xtb_runtime' $name) -Force
          }
      - name: Configure Qt application
        shell: pwsh
        run: |
          cmake -S . -B build-current -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
      - name: Compile and run CTest
        shell: pwsh
        run: |
          cmake --build build-current --config Release --parallel 4 --target Youngcraft test_parser test_model
          if ($LASTEXITCODE -ne 0) { throw 'C++ application compilation failed' }
          ctest --test-dir build-current -C Release --output-on-failure -R parser_gaussian
          if ($LASTEXITCODE -ne 0) { throw 'Parser regression tests failed' }
          ctest --test-dir build-current -C Release --output-on-failure -R model_atoms_bonds
          if ($LASTEXITCODE -ne 0) { throw 'Model regression tests failed' }
      - name: Package optimized portable ZIP
        shell: powershell
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/package_portable.ps1 -Python python
          if ($LASTEXITCODE -ne 0) { throw 'Portable packaging failed' }
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Youngcraft-portable
          path: Youngcraft-portable.zip
          retention-days: 30
      - name: Publish downloadable update for one-click patcher
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-pathway-$env:GITHUB_RUN_NUMBER"
          gh release create $tag 'Youngcraft-portable.zip#YoungCraft portable for Windows x64' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'YoungCraft Project Library' --notes 'Adds the Project Library and Reaction Pathway editor, opened from the top toolbar. Optimized portable package for the standalone patcher.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
